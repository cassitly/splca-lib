[project]
name = "splca"
version = "0.1.0"
description = "Self-Predictive Local Credit Assignment: Biologically-plausible learning for neural networks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "setuptools>=80.9.0",
    "matplotlib>=3.4.0",
    "numpy>=1.21.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchvision>=0.15.0",
    "tqdm>=4.62.0",
]
authors = [
    {name = "cassitly", email = "102461124+cassitly@users.noreply.github.com"},
    {name = "Cassitly", email = "cassitly@nakashireyumi.com"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/cassitly/splca"

[project.optional-dependencies]
dev = [
    "black>=22.0.0",
    "flake8>=4.0.0",
    "pytest>=7.0.0",
]
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pdm]
distribution = true
